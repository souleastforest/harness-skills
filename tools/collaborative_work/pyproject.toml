[project]
name = "collaborative-work-release"
version = "0.1.0"
description = "Reproducible release checks for the collaborative-work Codex plugin"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3", "markdown-it-py==4.2.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
cwrelease = "cwrelease.__main__:main"

[tool.setuptools]
packages = ["cwrelease"]
